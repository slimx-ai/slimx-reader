# SlimX-RAG knowledge engine for SlimX Reader.
#
#   docker compose -f docker-compose.rag.yml up
#   ./scripts/check-rag.sh
#
# SlimX-RAG (github.com/slimx-ai/SlimX-RAG) is a separate service; SlimX Reader only *consumes* it.
# Default local setup: offline `hf` MiniLM embeddings (384-dim, baked into the image) + the `local`
# JSONL vector backend, so indexing/retrieval need no cloud keys and no Ollama.
#
# If the published image is unavailable, build it from the SlimX-RAG repo and set:
#   SLIMX_RAG_IMAGE=slimx-rag:local   (docker build -t slimx-rag:local /path/to/SlimX-RAG)

services:
  slimx-rag:
    image: ${SLIMX_RAG_IMAGE:-ghcr.io/slimx-ai/slimx-rag:latest}
    command: ["slimx-rag", "serve", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    environment:
      RAG_EMBED_PROVIDER: hf
      RAG_HF_MODEL: sentence-transformers/all-MiniLM-L6-v2
      RAG_INDEX_BACKEND: local
      RAG_INDEX_PATH: /data/index.jsonl
      RAG_STATE_PATH: /data/state.json
      # Optional bearer token; set READER_SLIMX_RAG_AUTH_TOKEN on the reader side to match.
      RAG_AUTH_TOKEN: ${READER_SLIMX_RAG_AUTH_TOKEN:-}
    volumes:
      - slimx-rag-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)
      interval: 10s
      timeout: 5s
      retries: 12

  # Optional local model server for grounded answers: `docker compose -f docker-compose.rag.yml --profile ollama up`
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  slimx-rag-data:
  ollama-data:
