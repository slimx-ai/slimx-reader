name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (lint · types · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest
        # Runs fully offline: cloud off, SlimX-RAG fake adapter, in-memory SQLite.
        env:
          READER_ALLOW_CLOUD_PROVIDERS: "false"
          READER_ENABLE_RAG: "false"
        run: python -m pytest -q

  web:
    name: Web (typecheck · lint · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test

  web-lite:
    # web-lite imports apps/web sources directly; its typecheck compiles them too, so this job is
    # what catches an apps/web refactor breaking the browser-only build.
    name: Web Lite (typecheck · tests · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web-lite/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck (includes shared apps/web sources)
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build (static site)
        run: npm run build

# Playwright e2e is a live-stack integration test (it needs the API + web running), so it is not
# part of push CI. Run it locally against a running stack — see CONTRIBUTING.md.
