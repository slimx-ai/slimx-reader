[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slimx-reader-api"
version = "0.1.0"
description = "Local-first document reader API for SlimX Reader (FastAPI backend)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.4.0",
  "sqlmodel>=0.0.22",
  "sqlalchemy>=2.0.32",
  "httpx>=0.27.0",
  "pypdf>=4.3.1",
  "python-multipart>=0.0.9",
  # SlimX (model execution). Lazy-imported: the reader runs (retrieval-only) even
  # if this is missing or a local model is unreachable. Published on PyPI as `slimx`;
  # for local dev against the sibling checkout, `pip install -e ../../slimx`, or pin the
  # git build: `slimx @ git+https://github.com/slimx-ai/slimx.git`.
  "slimx>=1.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
ignore_missing_imports = true
warn_unused_ignores = false
no_implicit_optional = true
