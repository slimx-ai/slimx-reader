# SlimX Reader in Docker.
#
#   docker compose up --build                  # reader only: web + API, built from this repo
#   docker compose --profile rag up --build    # + SlimX-RAG for indexing & grounded Q&A
#   open http://localhost:3200
#
# Without the `rag` profile the reader is fully usable for reading/annotation; indexing parks as
# "waiting_for_rag" until SlimX-RAG is reachable. The slimx-rag image comes from a separate repo
# (github.com/slimx-ai/SlimX-RAG) and is pull-only here — if the published image is unavailable,
# build it there and set SLIMX_RAG_IMAGE=slimx-rag:local.
#
# Ports bind to 127.0.0.1 by default: the API has NO authentication (local single-user app), so it
# must not be exposed to the LAN casually. To serve your network anyway: READER_BIND=0.0.0.0 — and
# read SECURITY.md first.
#
# For grounded answers, run a local model on the host (Ollama) — the API reaches it via
# host.docker.internal. Or run `docker compose --profile ollama -f docker-compose.rag.yml up`.
#
# Prefer the lighter native loop for development: `./scripts/dev.sh`.

services:
  api:
    image: ${READER_API_IMAGE:-ghcr.io/slimx-ai/slimx-reader-api:latest}
    build: ./apps/api
    ports:
      - "${READER_BIND:-127.0.0.1}:8200:8200"
    environment:
      READER_ENABLE_RAG: ${READER_ENABLE_RAG:-true}
      READER_SLIMX_RAG_URL: ${READER_SLIMX_RAG_URL:-http://slimx-rag:8080}
      READER_SLIMX_RAG_AUTH_TOKEN: ${READER_SLIMX_RAG_AUTH_TOKEN:-}
      READER_ALLOW_CLOUD_PROVIDERS: ${READER_ALLOW_CLOUD_PROVIDERS:-false}
      READER_OLLAMA_BASE_URL: ${READER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - reader-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    image: ${READER_WEB_IMAGE:-ghcr.io/slimx-ai/slimx-reader-web:latest}
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8200}
    ports:
      - "${READER_BIND:-127.0.0.1}:3200:3200"
    depends_on:
      - api

  slimx-rag:
    profiles: ["rag"]
    image: ${SLIMX_RAG_IMAGE:-ghcr.io/slimx-ai/slimx-rag:latest}
    command: ["slimx-rag", "serve", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      RAG_EMBED_PROVIDER: hf
      RAG_HF_MODEL: sentence-transformers/all-MiniLM-L6-v2
      RAG_INDEX_BACKEND: local
      RAG_INDEX_PATH: /data/index.jsonl
      RAG_STATE_PATH: /data/state.json
      RAG_AUTH_TOKEN: ${READER_SLIMX_RAG_AUTH_TOKEN:-}
    volumes:
      - slimx-rag-data:/data

volumes:
  reader-data:
  slimx-rag-data:
